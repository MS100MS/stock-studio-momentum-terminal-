   VIEW: HISTORY
   ========================================================================= */
function renderHistory(){
  if(!App.history.length){
    return renderEmpty('No history yet','Import snapshots over multiple days — Daily History is built automatically.', false);
  }
  if(App.history.length < 2){
    return renderEmpty('Only one snapshot so far','The history chart will populate once there are two or more daily snapshots.', false);
  }

  const latestSnap = App.history[App.history.length - 1];
  const latestDate = latestSnap.date;
  const latestIncluded = latestSnap.rows.filter(function(r){
    return r.universeStatus === 'INCLUDED' && r.trueScore !== null && isFinite(r.trueScore);
  });
  const latestMedian = latestIncluded.length
    ? MomentumEngine.median(latestIncluded.map(function(r){ return r.trueScore; }))
    : null;

  const symbols = Array.from(new Set(App.history.reduce(function(acc,h){ return acc.concat(h.rows.map(function(r){ return r.symbol; })); },[])));

  const STATE_RANK = { Strong: 4, Qualified: 3, Fading: 2 };

  function round1(v){ return Math.round(v*10)/10; }

  const stats = symbols.map(function(sym){
    let strong=0, qual=0, fade=0, streak=0, lastState='', lastChange='', lastSeen='';
    App.history.forEach(function(h){
      const r = h.rows.find(function(x){ return x.symbol===sym; });
      if(!r) return;
      lastSeen = h.date;
      if(r.state==='Strong') strong++;
      if(r.state==='Qualified') qual++;
      if(r.state==='Fading') fade++;
      if(r.state !== lastState){ lastChange = h.date; lastState = r.state; streak=1; }
      else streak++;
    });

    let latestRow = latestSnap.rows.find(function(x){ return x.symbol===sym; });
    let delta = null;
    if(latestRow && latestRow.trueScore !== null && latestMedian !== null){
      delta = round1(latestRow.trueScore - latestMedian);
    }

    const isStale = lastSeen !== latestDate;

    return {
      sym:sym,
      strong:strong, qual:qual, fade:fade,
      streak:streak,
      lastState:lastState, lastChange:lastChange,
      lastSeen:lastSeen,
      delta:delta,
      isStale:isStale
    };
  })
  .filter(function(s){
    return s.lastState === 'Strong' || s.lastState === 'Qualified' || s.lastState === 'Fading';
  })
  .sort(function(a,b){
    if(a.isStale !== b.isStale) return a.isStale ? 1 : -1;

    const ra = STATE_RANK[a.lastState] || 0;
    const rb = STATE_RANK[b.lastState] || 0;
    if(rb !== ra) return rb - ra;

    const aDays = a.lastState==='Strong' ? a.strong : a.lastState==='Qualified' ? a.qual : a.fade;
    const bDays = b.lastState==='Strong' ? b.strong : b.lastState==='Qualified' ? b.qual : b.fade;
    if(bDays !== aDays) return bDays - aDays;

    if(b.streak !== a.streak) return b.streak - a.streak;

    return a.sym.localeCompare(b.sym);
  });

  function deltaCell(delta){
    if(delta === null || !isFinite(delta)) return el('td',{class:'num muted'},'—');
    const cls = delta > 0.05 ? 'pos' : delta < -0.05 ? 'neg' : 'neu';
    const sign = delta > 0.05 ? '+' : '';
    return el('td',{class:'num'}, el('span',{class:'vs-med '+cls}, sign + delta.toFixed(1)));
  }

  function lastStateCell(s){
    const chip = stateChip(s.lastState);
    if(s.isStale){
      return el('td',{html: chip + '<span class="chip stale">stale · last seen ' + s.lastSeen + '</span>'});
    }
    return el('td',{html: chip});
  }

  const staleCount = stats.filter(function(s){ return s.isStale; }).length;

  const lb = el('div',{class:'panel',style:'margin-top:18px'},
    el('div',{class:'panel-head'},
      el('div',{class:'panel-title'},'Persistence Leaderboard'),
      el('div',{class:'muted',style:'font-size:11px'},
        'Strong → Qualified → Fading · ranked by total days in state, then streak'
        + (latestMedian !== null ? ' · median = ' + latestMedian.toFixed(1) : '')
        + (staleCount > 0 ? ' · ' + staleCount + ' stale (not in latest snapshot)' : '')
      )
    ),
    el('div',{class:'panel-body',style:'padding:0'},
      el('table',{class:'tbl'},
        el('thead',{}, el('tr',{},
          el('th',{},'Symbol'),
          el('th',{class:'num'},'Strong Days'),
          el('th',{class:'num'},'Qualified Days'),
          el('th',{class:'num'},'Fading Days'),
          el('th',{class:'num'},'Current Streak'),
          el('th',{class:'num'},'vs Median'),
          el('th',{},'Last State'),
          el('th',{},'Since')
        )),
        el('tbody',{}, stats.slice(0,40).map(function(s){
          return el('tr',{class:'clickable',onclick:function(){ openDrawer(s.sym); }, style: s.isStale ? 'opacity:.75' : ''},
            el('td',{class:'sym'}, s.sym),
            el('td',{class:'num'}, String(s.strong)),
            el('td',{class:'num'}, String(s.qual)),
            el('td',{class:'num'}, String(s.fade)),
            el('td',{class:'num', style:'font-weight:600'}, String(s.streak)),
            deltaCell(s.delta),
            lastStateCell(s),
            el('td',{class:'muted'}, s.lastChange)
          );
        }))
      )
    )
  );

  const W=900, H=280, pad=44;
  const rows = App.history.map(function(h){
    const inc = h.rows.filter(function(r){ return r.universeStatus==='INCLUDED' && r.trueScore!==null; });
    const vals = inc.map(function(r){ return r.trueScore; });
    return {
      date: h.date,
      avg: vals.length ? MomentumEngine.mean(vals) : null,
      med: vals.length ? MomentumEngine.median(vals) : null,
      count: vals.length
    };
  }).filter(function(x){ return x.avg!==null; });

  const allVals = rows.reduce(function(acc,r){ if(r.avg!==null) acc.push(r.avg); if(r.med!==null) acc.push(r.med); return acc; }, []);
  const rawMin = Math.min.apply(null, allVals);
  const rawMax = Math.max.apply(null, allVals);
  const minV = Math.max(0,   rawMin - 5);
  const maxV = Math.min(100, rawMax + 5);
  const rng = (maxV-minV) || 1;

  const xAt = function(i){ return pad + i*((W-pad*2)/(rows.length-1||1)); };
  const yAt = function(v){ return H - pad - ((v-minV)/rng)*(H-pad*2); };

  const avgPts = rows.map(function(r,i){ return {x:xAt(i), y:yAt(r.avg), v:r.avg, date:r.date}; });
  const medPts = rows.map(function(r,i){ return {x:xAt(i), y:yAt(r.med), v:r.med, date:r.date}; });

  let avgPath = '', medPath = '';
  avgPts.forEach(function(p,i){ avgPath += (i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1); });
  medPts.forEach(function(p,i){ medPath += (i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1); });

  let bandPath = avgPath;
  for(let i = medPts.length - 1; i >= 0; i--){
    const p = medPts[i];
    bandPath += ' L ' + p.x.toFixed(1) + ' ' + p.y.toFixed(1);
  }
  bandPath += ' Z';

  const areaPath = avgPath + ' L '+avgPts[avgPts.length-1].x+' '+(H-pad)+' L '+avgPts[0].x+' '+(H-pad)+' Z';

  let grid = '';
  const gridSteps = 4;
  for(let g=0; g<=gridSteps; g++){
    const y = pad + (H-pad*2)*(g/gridSteps);
    const val = maxV - (rng)*(g/gridSteps);
    grid += '<line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="rgba(255,255,255,.04)"/>';
    grid += '<text x="'+(pad-8)+'" y="'+(y+3)+'" text-anchor="end" fill="#5e6b7e" font-size="10">'+val.toFixed(1)+'</text>';
  }

  const chartHtml = '<svg width="100%" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">' +
    '<defs>' +
      '<linearGradient id="areaGrad2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6c9eff" stop-opacity=".28"/><stop offset="100%" stop-color="#6c9eff" stop-opacity="0"/></linearGradient>' +
      '<linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e0b25c" stop-opacity=".18"/><stop offset="100%" stop-color="#e0b25c" stop-opacity=".05"/></linearGradient>' +
    '</defs>' +
    grid +
    '<path d="'+bandPath+'" fill="url(#bandGrad)" stroke="none"/>' +
    '<path d="'+areaPath+'" fill="url(#areaGrad2)"/>' +
    '<path d="'+avgPath+'" fill="none" stroke="#6c9eff" stroke-width="2.2"/>' +
    '<path d="'+medPath+'" fill="none" stroke="#3fb68b" stroke-width="2" stroke-dasharray="5 4"/>' +
    avgPts.map(function(p){
      return '<circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="#6c9eff" stroke="#141a24" stroke-width="1.5"><title>'+p.date+' · Avg '+p.v.toFixed(1)+'</title></circle>';
    }).join('') +
    medPts.map(function(p){
      return '<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="#3fb68b" stroke="#141a24" stroke-width="1.5"><title>'+p.date+' · Median '+p.v.toFixed(1)+'</title></circle>';
    }).join('') +
    rows.map(function(r,i){
      return '<text x="'+xAt(i)+'" y="'+(H-pad+18)+'" text-anchor="middle" fill="#5e6b7e" font-size="10">'+r.date.slice(5)+'</text>';
    }).join('') +
    '</svg>';

  const chartLegend = el('div',{style:'display:flex;gap:18px;align-items:center;font-size:11.5px;color:var(--text-2);margin-top:8px;padding:0 4px;flex-wrap:wrap'},
    el('div',{style:'display:flex;align-items:center;gap:6px'}, el('span',{style:'display:inline-block;width:14px;height:2px;background:#6c9eff;border-radius:2px'}), 'Average'),
    el('div',{style:'display:flex;align-items:center;gap:6px'}, el('span',{style:'display:inline-block;width:14px;height:2px;background:#3fb68b;border-radius:2px;border-top:2px dashed #3fb68b'}), 'Median'),
    el('div',{style:'display:flex;align-items:center;gap:6px'}, el('span',{style:'display:inline-block;width:14px;height:10px;background:rgba(224,178,92,.18);border:1px solid rgba(224,178,92,.3);border-radius:2px'}), 'Divergence band'),
    el('div',{class:'muted',style:'margin-left:auto;font-size:11px'}, rows.length+' snapshots · '+rows[rows.length-1].count+' included on latest')
  );

  const chart = el('div',{class:'panel'},
    el('div',{class:'panel-head'},
      el('div',{class:'panel-title'},'True Momentum Score · Average vs Median'),
      el('div',{class:'muted',style:'font-size:11px'},'Median resists outliers · band widens when they diverge')
    ),
    el('div',{class:'history-chart', html: chartHtml}),
    chartLegend
  );

  const dates = App.history.map(function(h){ return h.date; }).sort();
  const latest = dates[dates.length-1];
  const datesPanel = el('div',{class:'panel',style:'margin-top:18px'},
    el('div',{class:'panel-head'},
      el('div',{class:'panel-title'},'Loaded Snapshots'),
      el('div',{class:'muted',style:'font-size:11px'}, dates.length+' of '+App.rollingWindow+' rolling window')
    ),
    el('div',{class:'snapshot-dates'},
      el('span',{class:'sd-label'},'Dates:'),
      dates.map(function(d){
        return el('span',{class:'sd-chip'+(d===latest?' latest':'')}, d);
      })
    )
  );

  return [
    el('div',{class:'page-head'},
      el('div',{},
        el('div',{class:'page-title'},'Momentum History'),
        el('div',{class:'page-sub'},'How momentum and classifications move across daily snapshots. Oldest snapshots roll off automatically when the window fills.')
      )
    ),
    chart,
    lb,
    datesPanel
  ];
}

function renderSettings(){
  const s = App.settings;
  const numField = function(key,label,step,min,max){
    step = step===undefined?1:step;
    return el('div',{class:'field'},
      el('label',{}, label),
      el('input',{type:'number', value:s[key], step:step, min:min, max:max, onchange:function(e){
        App.settings[key] = Number(e.target.value);
        if(App.result) App.result = MomentumEngine.run(App.result.rows, App.settings);
        saveToStorage();
        toast('Settings updated');
      }})
    );
  };
  const toggle = function(key,label,desc){
    return el('div',{class:'field', style:'flex-direction:row;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)'},
      el('input',{type:'checkbox', checked:s[key]?true:null, onchange:function(e){
        App.settings[key]=e.target.checked;
        if(App.result) App.result = MomentumEngine.run(App.result.rows, App.settings);
        saveToStorage();
        toast('Settings updated');
      }}),
      el('div',{},
        el('div',{style:'font-size:13px;font-weight:500'}, label),
        el('div',{style:'font-size:11.5px;color:var(--text-3);margin-top:2px'}, desc)
      )
    );
  };

  const rollingField = el('div',{class:'field', style:'max-width:220px'},
    el('label',{},'Rolling window (trading days)'),
    el('input',{type:'number', min:5, max:250, value:App.rollingWindow, onchange:function(e){
      let n = Number(e.target.value);
      if(!isFinite(n) || n < 5) n = 5;
      if(n > 250) n = 250;
      App.rollingWindow = n;
      e.target.value = n;
      const dropped = applyRollingWindow();
      saveToStorage();
      updateStatus();
      toast(dropped ? (dropped + ' oldest snapshot' + (dropped===1?'':'s') + ' rolled off') : ('Window set to ' + n + ' days'));
      if(App.view==='settings') render();
    }})
  );

  const bytes = estimateHistoryBytes();
  const quotaBytes = 5 * 1024 * 1024;
  const pct = Math.min(100, (bytes/quotaBytes)*100);
  const meterCls = pct >= 90 ? 'danger' : pct >= 70 ? 'warn' : '';
  const kb = (bytes/1024).toFixed(1);
  const storageMeter = el('div',{class:'storage-meter'},
    el('div',{style:'display:flex;justify-content:space-between;font-size:12px;color:var(--text-2)'},
      el('span',{}, 'History storage: ' + kb + ' KB / ~5 MB'),
      el('span',{class:'muted'}, App.history.length + ' snapshots · window ' + App.rollingWindow + ' days')
    ),
    el('div',{class:'sm-bar'}, el('span',{class:meterCls, style:'width:'+pct.toFixed(1)+'%'})),
    el('div',{class:'sm-legend'},
      el('span',{}, pct.toFixed(1)+'% of ~5 MB localStorage budget'),
      el('span',{}, 'Older snapshots are dropped automatically once the window is full')
    )
  );

  return [
    el('div',{class:'page-head'},
      el('div',{},
        el('div',{class:'page-title'},'Settings'),
        el('div',{class:'page-sub'},'All thresholds are editable. Changes re-score the current snapshot only — history is preserved as recorded.')
      )
    ),
    el('div',{class:'panel'},
      el('div',{class:'panel-head'}, el('div',{class:'panel-title'},'Scoring')),
      el('div',{class:'panel-body', style:'display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px'},
        numField('dispersionWeight','Dispersion weight',0.1,0,2),
        numField('accelerationThreshold','Acceleration threshold',1,0,50),
        numField('decelerationThreshold','Deceleration threshold',1,0,50),
        numField('accelerationBonus','Acceleration bonus',1,-50,50),
        numField('decelerationPenalty','Deceleration penalty',1,-50,50),
        numField('highDispersionThreshold','High dispersion threshold',1,0,50),
        numField('strongCutoff','Strong cutoff',1,0,100),
        numField('qualifiedCutoff','Qualified cutoff',1,0,100),
        numField('topN','Top-N shortlist size',1,1,100),
        numField('dipN','Dip Watch size',1,1,100),
        numField('fadeN','Fading Watch size',1,1,100)
      )
    ),
    el('div',{class:'panel', style:'margin-top:18px'},
      el('div',{class:'panel-head'}, el('div',{class:'panel-title'},'Universe exclusions')),
      el('div',{class:'panel-body'},
        toggle('excludeFinancials','Exclude financial sector','Banks, NBFCs, insurance, housing finance, asset management, etc.'),
        toggle('excludeAlcohol','Exclude alcohol / liquor / brewery','Off by default. Enable to remove these sectors from the universe.'),
        toggle('excludeMedia','Exclude media / entertainment','Off by default. Enable to remove these sectors from the universe.')
      )
    ),
    el('div',{class:'panel', style:'margin-top:18px'},
      el('div',{class:'panel-head'}, el('div',{class:'panel-title'},'History retention')),
      el('div',{class:'panel-body'},
        el('div',{style:'font-size:12.5px;color:var(--text-2);margin-bottom:14px'},
          'The dashboard keeps the most recent N trading days in memory and in localStorage. When the window is full, each new snapshot automatically drops the oldest one. Set N to 30 for a rolling month, 60 for two months, or up to 250 for roughly a year.'),
        rollingField,
        storageMeter
      )
    ),
    el('div',{class:'panel', style:'margin-top:18px'},
      el('div',{class:'panel-head'}, el('div',{class:'panel-title'},'Data Management')),
      el('div',{class:'panel-body'},
        el('div',{style:'font-size:12.5px;color:var(--text-2);margin-bottom:16px'},
          App.history.length + ' snapshot' + (App.history.length===1?'':'s') + ' in history. ' +
          (App.result ? ('Current snapshot: ' + (App.snapshotDate||'—') + ' · ' + App.result.kpis.included + ' included.') : 'No active snapshot.')
        ),
        el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px'},
          el('button',{class:'btn', onclick:function(){ refreshSnapshot(); }},'Refresh snapshot'),
          el('button',{class:'btn', onclick:function(){ resetSnapshot(); }},'Reset current snapshot'),
          el('button',{class:'btn', onclick:function(){ exportHistory(); }},'Export history (JSON)'),
          el('button',{class:'btn', onclick:function(){ document.getElementById('historyImportInput').click(); }},'Import history (JSON)'),
          el('input',{type:'file', id:'historyImportInput', accept:'.json,application/json', style:'display:none', onchange:function(e){
            const file = e.target.files[0];
            if(file) importHistory(file);
            e.target.value = '';
          }})
        ),
        el('div',{style:'display:flex;gap:10px;flex-wrap:wrap'},
          el('button',{class:'btn danger', onclick:function(){ deleteAllData(); }},'Delete everything')
        ),
        el('div',{style:'font-size:11.5px;color:var(--text-3);margin-top:14px;line-height:1.6'},
          'Refresh re-runs the engine on the current snapshot. Reset clears the active snapshot but keeps history. Export saves all loaded snapshots to a JSON file for backup or migration. Import merges a JSON backup into the current history, deduplicating by date.')
      )
    )
  ];
}

/* ============================================================================
   EXPORT EXCEL — full workbook, respecting dashboard filters
   ========================================================================= */
function stockHeader(){
  return ['Symbol','Name','Exchange','Sector','Industry',
          '1M','3M','6M','Avg','Dispersion','Trend','True Score','State',
          'Universe','Close','Chg%'];
}
function stockRow(x){
  return [
    x.symbol, x.stockName, x.exch, x.sector, x.industry,
    x.m1, x.m3, x.m6, x.avgScore, x.dispersion, x.trend, x.trueScore, x.state,
    x.universeStatus, x.close, x.chgPct
  ];
}

function exportExcel(){
  if(!App.result || !App.result.rows.length){
    toast('No snapshot loaded to export');
    return;
  }
  const r = App.result;
  const s = r.settings;
  const sheets = [];

  /* ---- Sheet: Summary ---- */
  sheets.push({name:'Summary', rows:[
    ['Momentum Terminal Export'],
    ['Snapshot Date', App.snapshotDate || '—'],
    ['Exported At', new Date().toISOString()],
    [],
    ['KPI', 'Value'],
    ['Current Universe', r.kpis.currentUnique],
    ['Included', r.kpis.included],
    ['Excluded', r.kpis.excluded],
    ['Incomplete', r.kpis.incomplete],
    ['Strong', r.kpis.strong],
    ['Qualified', r.kpis.qualified],
    ['Fading', r.kpis.fading],
    ['Inconsistent', r.kpis.inconsistent],
    [],
    ['Setting', 'Value'],
    ['Strong Cutoff', s.strongCutoff],
    ['Qualified Cutoff', s.qualifiedCutoff],
    ['Dispersion Weight', s.dispersionWeight],
    ['Acceleration Threshold', s.accelerationThreshold],
    ['Deceleration Threshold', s.decelerationThreshold],
    ['Acceleration Bonus', s.accelerationBonus],
    ['Deceleration Penalty', s.decelerationPenalty],
    ['High Dispersion Threshold', s.highDispersionThreshold],
    ['Exclude Financials', s.excludeFinancials ? 'Yes' : 'No'],
    ['Exclude Alcohol', s.excludeAlcohol ? 'Yes' : 'No'],
    ['Exclude Media', s.excludeMedia ? 'Yes' : 'No'],
    ['Rolling Window (days)', App.rollingWindow]
  ]});

  /* ---- Sheet: All Stocks (full current universe, non-duplicate) ---- */
  const allStocks = r.rows
    .filter(function(x){ return x.universeStatus !== 'OLD_SNAPSHOT'; })
    .slice()
    .sort(function(a,b){
      const av = (a.trueScore===null||!isFinite(a.trueScore)) ? -Infinity : a.trueScore;
      const bv = (b.trueScore===null||!isFinite(b.trueScore)) ? -Infinity : b.trueScore;
      if(bv !== av) return bv - av;
      return a.symbol.localeCompare(b.symbol);
    });
  sheets.push({name:'All Stocks', rows:[stockHeader()].concat(allStocks.map(stockRow))});

  /* ---- Sheet per KPI drilldown (uses same DRILLS.filterFn as dashboard) ---- */
  Object.keys(DRILLS).forEach(function(key){
    const def = DRILLS[key];
    const rows = r.rows.filter(def.filterFn).slice().sort(function(a,b){
      const av = (a.trueScore===null||!isFinite(a.trueScore)) ? -Infinity : a.trueScore;
      const bv = (b.trueScore===null||!isFinite(b.trueScore)) ? -Infinity : b.trueScore;
      if(bv !== av) return bv - av;
      return a.symbol.localeCompare(b.symbol);
    });
    const out = [[def.label], [def.sub], [], stockHeader()];
    rows.forEach(function(x){ out.push(stockRow(x)); });
    if(!rows.length) out.push(['(none)']);
    sheets.push({name: def.label, rows: out});
  });

  /* ---- Sheets: Shortlists (already engine-filtered) ---- */
  const slHdr = stockHeader();
  sheets.push({name:'Top True Momentum', rows:[[ 'Top True Momentum', '(top ' + s.topN + ')' ], [], slHdr].concat(r.shortlists.topTrueMomentum.map(stockRow))});
  sheets.push({name:'Dip Watch',         rows:[[ 'Momentum Dip Watch', '(top ' + s.dipN + ')' ], [], slHdr].concat(r.shortlists.dipWatch.map(stockRow))});
  sheets.push({name:'Fading Watch',      rows:[[ 'Fading Momentum Watch', '(top ' + s.fadeN + ')' ], [], slHdr].concat(r.shortlists.fadingWatch.map(stockRow))});

  /* ---- Sheet: Sector Pulse ---- */
  const secRows = [['Sector','Stocks','Avg True Score','Strong/Qualified','Avg 1M','Avg 3M','Avg 6M','Insight']];
  r.sectorPulse.forEach(function(sp){
    secRows.push([sp.sector, sp.stocks, sp.avgTrueScore, sp.strongQualified, sp.avgM1, sp.avgM3, sp.avgM6, sp.insight]);
  });
  sheets.push({name:'Sector Pulse', rows: secRows});

  /* ---- Sheet: Radar (respects current radar filters + global search) ---- */
  const radarRows = filteredRadarRows();
  const sortedRadar = radarRows.slice().sort(function(a,b){
    const k = App.radarSort.key, dir = App.radarSort.dir;
    const av = a[k], bv = b[k];
    if(av===null||av===undefined) return 1;
    if(bv===null||bv===undefined) return -1;
    if(typeof av==='string') return dir==='asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return dir==='asc' ? av-bv : bv-av;
  });
  const radarSheetRows = [
    ['Radar — Filtered View'],
    ['Search', App.search || '(none)'],
    ['Sector', App.radarFilters.sector || 'All'],
    ['State', App.radarFilters.state || 'All'],
    ['Trend', App.radarFilters.trend || 'All'],
    ['Min True Score', App.radarFilters.minScore || '—'],
    [],
    stockHeader()
  ];
  sortedRadar.forEach(function(x){ radarSheetRows.push(stockRow(x)); });
  if(!sortedRadar.length) radarSheetRows.push(['(no matching stocks)']);
  sheets.push({name:'Radar (Filtered)', rows: radarSheetRows});

  /* ---- Sheet: Distribution buckets ---- */
  const distRows = [['Bucket','Min','Max','Count']];
  BUCKETS.forEach(function(b){
    const cnt = r.rows.filter(function(x){
      return x.universeStatus==='INCLUDED' && x.trueScore!==null && isFinite(x.trueScore)
        && x.trueScore >= b.min && x.trueScore < b.max;
    }).length;
    distRows.push([b.label, b.min, b.max === 101 ? '100+' : b.max, cnt]);
  });
  sheets.push({name:'Distribution', rows: distRows});

  /* ---- Sheet: History (all snapshots) ---- */
  if(App.history.length){
    const histRows = [['Date','Symbol','State','True Score','Avg','Dispersion','Trend','1M','3M','6M']];
    App.history.forEach(function(h){
      h.rows.forEach(function(hr){
        histRows.push([h.date, hr.symbol, hr.state, hr.trueScore, hr.avgScore,
                       hr.dispersion, hr.trend, hr.m1, hr.m3, hr.m6]);
      });
    });
    sheets.push({name:'History', rows: histRows});
  }

  /* ---- Build and download ---- */
  try {
    const bytes = XLSXWriter.build(sheets);
    const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'momentum-export-' + (App.snapshotDate || new Date().toISOString().slice(0,10)) + '.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Exported ' + sheets.length + ' sheets to Excel');
  } catch(err){
    console.error(err);
    toast('Excel export failed: ' + (err && err.message ? err.message : err));
  }
}


/* ============================================================================
   EXPORT / IMPORT HISTORY (JSON)
   ========================================================================= */
function exportHistory(){
  if(!App.history.length){ toast('Nothing to export'); return; }
  const payload = {
    version: 1,
    exportedAt: new Date().toISOString(),
    rollingWindow: App.rollingWindow,
    snapshotDate: App.snapshotDate,
    history: App.history
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const stamp = new Date().toISOString().slice(0,10);
  a.download = 'momentum-history-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Exported ' + App.history.length + ' snapshots');
}

function importHistory(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const payload = JSON.parse(e.target.result);
      const incoming = Array.isArray(payload) ? payload : (payload.history || []);
      if(!Array.isArray(incoming) || !incoming.length){
        toast('No history found in file'); return;
      }
      const byDate = new Map();
      App.history.forEach(function(h){ byDate.set(h.date, h); });
      let added = 0, replaced = 0;
      incoming.forEach(function(h){
        if(!h || !h.date || !Array.isArray(h.rows)) return;
        if(byDate.has(h.date)) replaced++;
        else added++;
        byDate.set(h.date, h);
      });
      App.history = Array.from(byDate.values());
      App.history.sort(function(a,b){ return a.date.localeCompare(b.date); });
      const dropped = applyRollingWindow();
      saveToStorage();
      updateStatus();
      toast('Imported ' + added + ' new, ' + replaced + ' replaced'
        + (dropped ? ', ' + dropped + ' rolled off' : ''));
      render();
    } catch(err){
      toast('Could not parse JSON: ' + err.message);
    }
  };
  reader.onerror = function(){ toast('Could not read file'); };
  reader.readAsText(file);
}


/* ============================================================================
   DATA MANAGEMENT ACTIONS
   ========================================================================= */
function refreshSnapshot(){
  if(!App.result || !App.result.rows){
    toast('No active snapshot to refresh');
    return;
  }
  const plainRows = App.result.rows.map(function(r){
    return {
      stockName: r.stockName, symbol: r.symbol, exch: r.exch,
      sector: r.sector, industry: r.industry,
      m1: r.m1, m3: r.m3, m6: r.m6, close: r.close, chgPct: r.chgPct
    };
  });
  const fresh = MomentumEngine.run(plainRows, App.settings);
  App.result = fresh;
  if(App.snapshotDate){
    const histRow = {
      date: App.snapshotDate,
      rows: fresh.rows.filter(function(r){ return r.universeStatus!=='OLD_SNAPSHOT'; }).map(function(r){
        return {
          symbol:r.symbol, state:r.state, trueScore:r.trueScore, avgScore:r.avgScore,
          dispersion:r.dispersion, trend:r.trend, m1:r.m1, m3:r.m3, m6:r.m6,
          universeStatus:r.universeStatus
        };
      })
    };
    App.history = App.history.filter(function(h){ return h.date !== App.snapshotDate; });
    App.history.push(histRow);
    App.history.sort(function(a,b){ return a.date.localeCompare(b.date); });
    applyRollingWindow();
  }
  saveToStorage();
  updateStatus();
  toast('Snapshot refreshed');
  render();
}

function resetSnapshot(){
  openModal({
    icon: '↺',
    iconClass: 'info',
    title: 'Reset current snapshot?',
    desc: 'This clears the active snapshot and returns you to the import screen.',
    bodyHtml: '<ul><li><b>History is kept</b> — all previously imported dates remain available under Momentum History.</li><li>Settings are kept.</li><li>You can re-import the current date later.</li></ul>',
    confirmLabel: 'Reset snapshot',
    confirmClass: 'primary',
    onConfirm: function(){
      App.result = null;
      App.snapshotDate = null;
      App.pendingImport = null;
      App.importOpen = false;
      App.openSymbol = null;
      App.drilldown = null;
      App.bucketDrill = null;
      closeDrawer();
      saveToStorage();
      updateStatus();
      navigate('command');
      toast('Snapshot reset · history preserved');
    }
  });
}

function deleteAllData(){
  openModal({
    icon: '!',
    iconClass: 'danger',
    title: 'Delete everything?',
    desc: 'This wipes the current snapshot, all history, and all custom settings.',
    bodyHtml: '<ul>' +
      '<li>Current snapshot: <b>cleared</b></li>' +
      '<li>History (' + App.history.length + ' snapshot' + (App.history.length===1?'':'s') + '): <b>cleared</b></li>' +
      '<li>Settings: <b>reset to defaults</b></li>' +
      '</ul>' +
      '<div style="margin-top:12px;color:#e09287;font-size:12px">This cannot be undone.</div>',
    confirmLabel: 'Delete everything',
    confirmClass: 'danger',
    requireText: { expected: 'DELETE', placeholder: 'Type DELETE to confirm', label: 'Type DELETE in uppercase to enable the button.' },
    onConfirm: function(){
      App.result = null;
      App.snapshotDate = null;
      App.history = [];
      App.settings = Object.assign({}, MomentumEngine.DEFAULT_SETTINGS);
      App.pendingImport = null;
      App.importOpen = false;
      App.openSymbol = null;
      App.selectedSector = null;
      App.drilldown = null;
      App.bucketDrill = null;
      closeDrawer();
      try {
        Object.values(STORAGE_KEYS).forEach(function(k){ localStorage.removeItem(k); });
      } catch(_){}
      updateStatus();
      navigate('command');
      toast('All data deleted');
    }
  });
}

document.getElementById('btnRefresh').addEventListener('click', refreshSnapshot);
document.getElementById('btnReset').addEventListener('click', resetSnapshot);
document.getElementById('btnExportExcel').addEventListener('click', exportExcel);
document.getElementById('btnDeleteAll').addEventListener('click', deleteAllData);

function updateDataActions(){
  const hasSnapshot = !!(App.result && App.result.rows && App.result.rows.length);
  const hasHistory = App.history.length > 0;
  document.getElementById('btnRefresh').disabled = !hasSnapshot;
  document.getElementById('btnReset').disabled = !hasSnapshot && !hasHistory;
  document.getElementById('btnExportExcel').disabled = !hasSnapshot;
  document.getElementById('btnDeleteAll').disabled = !hasSnapshot && !hasHistory;
}


/* ============================================================================
   IMPORT
   ========================================================================= */
function wireImport(){
  const dz = document.getElementById('dropZone');
  const fi = document.getElementById('fileInput');
  if(!dz || !fi) return;
  if(dz._wired) return;
  dz._wired = true;

  dz.addEventListener('click', function(){ fi.click(); });
  fi.addEventListener('change', function(e){
    const file = e.target.files[0];
    if(file) readFile(file);
  });
  ['dragover','dragenter'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add('drag'); }); });
  ['dragleave','drop'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove('drag'); }); });
  dz.addEventListener('drop', function(e){
    const file = e.dataTransfer.files[0];
    if(file) readFile(file);
  });
}

function setImportAlert(msg, kind){
  kind = kind || 'ok';
  const host = document.getElementById('importAlerts');
  if(!host) return;
  if(!msg){ host.innerHTML=''; return; }
  host.innerHTML = '<div class="alert '+kind+'">'+msg+'</div>';
}

function readFile(file){
  if(/\.xlsx?$/i.test(file.name)){
    setImportAlert('This looks like an Excel workbook (.xlsx), not a CSV/TSV export. Open the <b>Raw Data</b> sheet in Excel, then <b>Save As → CSV UTF-8</b>, or copy the rows and paste them above.', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){ beginImportFromText(e.target.result, file.name); };
  reader.onerror = function(){ setImportAlert('Could not read file.', 'error'); };
  reader.readAsText(file);
}

function beginImportFromPaste(text){
  beginImportFromText(text, null);
}

function beginImportFromText(text, filename){
  if(!text || !text.trim()){ setImportAlert('Nothing to process.', 'warn'); return; }
  const matrix = parseDelimited(text);
  if(!matrix.length){
    setImportAlert('Header row not detected. The file should contain a row with column names such as <code>Stock Name</code>, <code>Symbol</code>, <code>1M Score</code>, etc.', 'error');
    return;
  }
  const mapped = mapRows(matrix);
  const rows = mapped.rows, missing = mapped.missing, header = mapped.header;

  if(missing.length){
    const shown = (header||[]).slice(0, 12).map(function(h){ return '"'+esc(String(h).trim())+'"'; }).join(', ');
    setImportAlert('<b>Header mismatch.</b> Missing column(s): <code>'+missing.join('</code>, <code>')+'</code>.<br>Header row read: '+shown, 'error');
    return;
  }

  let detected = null, source = null;
  if(filename){
    detected = detectDateFromFilename(filename);
    if(detected) source = 'filename';
  }
  if(!detected){
    const fromCol = detectDateFromMatrix(matrix);
    if(fromCol){ detected = fromCol; source = 'date column in file'; }
  }
  if(!detected && App.snapshotDate){
    detected = App.snapshotDate;
    source = 'last used date';
  }

  App.pendingImport = {
    text: text,
    matrix: matrix,
    rows: rows,
    filename: filename || null,
    detectedDate: detected,
    source: source
  };

  const preview = MomentumEngine.run(rows, App.settings);
  showConfirmCard(preview);
}

function clearPendingImport(){
  App.pendingImport = null;
  const host = document.getElementById('confirmHost');
  if(host) host.innerHTML = '';
}

function showConfirmCard(preview){
  const host = document.getElementById('confirmHost');
  if(!host) return;
  host.innerHTML = '';

  const p = App.pendingImport;
  const defaultDate = p.detectedDate || new Date().toISOString().slice(0,10);
  const exists = App.history.some(function(h){ return h.date === defaultDate; });

  const willOverflow = !exists && App.history.length >= App.rollingWindow;

  const card = el('div',{class:'confirm-card'},
    el('div',{class:'cc-title'},'Confirm snapshot date'),
    el('div',{class:'cc-meta'},
      (p.filename ? 'File: ' + p.filename + ' · ' : '') +
      (p.source ? 'Detected from: ' + p.source : 'No date detected — please pick one') +
      ' · ' + preview.kpis.included + ' included of ' + preview.kpis.currentUnique + ' parsed'
    ),
    el('div',{class:'cc-row'},
      el('div',{class:'field'},
        el('label',{},'Snapshot date'),
        el('input',{type:'date', id:'confirmDate', value: defaultDate})
      ),
      el('button',{class:'btn primary', onclick:function(){ commitPendingImport(); }},'Confirm & import'),
      el('button',{class:'btn ghost', onclick:function(){ clearPendingImport(); }},'Cancel')
    ),
    exists ? el('div',{class:'alert warn', style:'margin-top:12px;margin-bottom:0'},
      'A snapshot already exists for <b>'+defaultDate+'</b>. Confirming will replace it.') : null,
    willOverflow ? el('div',{class:'alert info', style:'margin-top:12px;margin-bottom:0'},
      'Window is full (' + App.history.length + '/' + App.rollingWindow + '). The oldest snapshot (' + App.history[0].date + ') will roll off when this is confirmed.') : null
  );

  host.appendChild(card);

  const dateInput = document.getElementById('confirmDate');
  if(dateInput){
    dateInput.addEventListener('change', function(){
      const d = dateInput.value;
      const nowExists = App.history.some(function(h){ return h.date === d; });
      const oldWarn = card.querySelector('.alert.warn');
      if(oldWarn) oldWarn.remove();
      if(nowExists){
        card.appendChild(el('div',{class:'alert warn', style:'margin-top:12px;margin-bottom:0'},
          'A snapshot already exists for <b>'+d+'</b>. Confirming will replace it.'));
      }
    });
  }
}

function commitPendingImport(){
  const p = App.pendingImport;
  if(!p){ setImportAlert('Nothing staged.', 'warn'); return; }

  const dateInput = document.getElementById('confirmDate');
  const chosenDate = dateInput ? dateInput.value : null;
  if(!chosenDate){ setImportAlert('Please pick a snapshot date.', 'warn'); return; }

  const result = MomentumEngine.run(p.rows, App.settings);
  if(result.fileErrors && result.fileErrors.length){
    setImportAlert('Engine could not parse: '+result.fileErrors.join(' '), 'error');
    return;
  }

  App.result = result;
  App.snapshotDate = chosenDate;
  App.drilldown = null;
  App.bucketDrill = null;

  const histRow = {
    date: chosenDate,
    rows: result.rows.filter(function(r){ return r.universeStatus!=='OLD_SNAPSHOT'; }).map(function(r){
      return {
        symbol:r.symbol, state:r.state, trueScore:r.trueScore, avgScore:r.avgScore,
        dispersion:r.dispersion, trend:r.trend, m1:r.m1, m3:r.m3, m6:r.m6,
        universeStatus:r.universeStatus
      };
    })
  };
  App.history = App.history.filter(function(h){ return h.date !== chosenDate; });
  App.history.push(histRow);
  App.history.sort(function(a,b){ return a.date.localeCompare(b.date); });
  const dropped = applyRollingWindow();

  App.importOpen = false;
  clearPendingImport();
  saveToStorage();
  updateStatus();

  const msg = 'Snapshot ' + chosenDate + ' loaded · ' + result.kpis.included + ' included'
    + (dropped ? ' · ' + dropped + ' rolled off' : '');
  if(result.invalid && result.invalid.length){
    toast('Imported ' + chosenDate + ' · ' + result.invalid.length + ' row(s) skipped');
  } else {
    toast(msg);
  }
  navigate('command');
}

function copySymbol(sym){
  const s = 'NSE:'+sym+'-EQ,';
  navigator.clipboard.writeText(s).then(function(){ toast('Copied '+s); });
}


/* ============================================================================
   ROUTER
   ========================================================================= */
function navigate(view){
  App.view = view;
  document.querySelectorAll('.nav-item').forEach(function(b){ b.classList.toggle('active', b.dataset.view===view); });
  render();
}

function render(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  let nodes;
  switch(App.view){
    case 'command':  nodes = renderCommandCentre(); break;
    case 'radar':    nodes = renderRadar(); break;
    case 'sector':   nodes = renderSector(); break;
    case 'history':  nodes = renderHistory(); break;
    case 'settings': nodes = renderSettings(); break;
    case 'how':      nodes = renderHow(); break;
    default:         nodes = renderCommandCentre();
  }
  (Array.isArray(nodes)?nodes:[nodes]).forEach(function(n){ if(n) main.appendChild(n); });
  if(App.view==='radar') refreshRadar();
  main.scrollTop = 0;
  updateDataActions();
}

function updateStatus(){
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if(App.result && App.result.kpis){
    dot.classList.remove('stale');
    txt.textContent = 'Snapshot '+(App.snapshotDate||'—')+' · '+App.result.kpis.included+' included';
  } else {
    dot.classList.add('stale');
    txt.textContent = App.history.length
      ? (App.history.length + ' snapshot' + (App.history.length===1?'':'s') + ' in history')
      : 'No snapshot loaded';
  }
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}


/* ============================================================================
   INIT
   ========================================================================= */
document.querySelectorAll('.nav-item').forEach(function(btn){
  btn.addEventListener('click', function(){ navigate(btn.dataset.view); });
});
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('drawerMask').addEventListener('click', closeDrawer);
document.addEventListener('keydown', function(e){
  if((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); document.getElementById('globalSearch').focus(); }
  if(e.key==='Escape'){ closeDrawer(); closeModal(); }
});
document.getElementById('globalSearch').addEventListener('input', function(e){
  App.search = e.target.value;
  if(App.view!=='radar') navigate('radar');
  else refreshRadar();
});

loadFromStorage();

render();
updateStatus();
</script>
